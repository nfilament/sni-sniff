name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to notice new compiler lints and dependency releases.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      matrix:
        toolchain: [stable, "1.88"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - run: cargo +${{ matrix.toolchain }} test --all-features
      - run: cargo +${{ matrix.toolchain }} build --no-default-features

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package
